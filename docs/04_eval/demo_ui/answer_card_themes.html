<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<title>ViVQA answer card theme check</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { width: 420px; padding: 16px; border-radius: 8px; }
  .panel.light {
    --block-background-fill: #ffffff;
    --body-text-color: #1f2328;
    --body-text-color-subdued: #57606a;
    --border-color-primary: #d0d7de;
    background: #f6f8fa; color: #1f2328;
  }
  .panel.dark {
    --block-background-fill: #161b22;
    --body-text-color: #e6edf3;
    --body-text-color-subdued: #9da7b3;
    --border-color-primary: #30363d;
    background: #0d1117; color: #e6edf3;
  }
  .panel.dark .wrap { /* simulate Gradio .dark ancestor */ }
  .vv-card{
    border:1px solid var(--border-color-primary,#d0d7de);
    border-radius:12px;padding:16px 18px;
    background:var(--block-background-fill,#ffffff);
    color:var(--body-text-color,#1f2328);
  }
  .vv-ans{
    font-size:1.6em;font-weight:700;margin:4px 0 10px;line-height:1.3;
    color:var(--body-text-color,#1f2328);
  }
  .vv-badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:600;font-size:.9em;margin-right:8px}
  .vv-mode{color:var(--body-text-color-subdued,#57606a);font-size:.9em}
  .dark .vv-card{
    background:var(--block-background-fill,#161b22);
    color:var(--body-text-color,#e6edf3);
    border-color:var(--border-color-primary,#30363d);
  }
  .dark .vv-ans{color:var(--body-text-color,#e6edf3)}
  .dark .vv-mode{color:var(--body-text-color-subdued,#9da7b3)}
  h2 { margin-top: 0; font-size: 1rem; }
</style>
</head>
<body>
<div class="row">
  <div class="panel light" id="light">
    <h2>Light theme (?__theme=light)</h2>
    <div class="vv-card">
      <div class="vv-mode">Câu trả lời</div>
      <div class="vv-ans">mèo</div>
      <span class="vv-badge" style="color:#0f5132;background:#d1e7dd">Độ tin cậy: Cao</span>
      <span class="vv-mode">Câu hỏi mở</span>
      <div class="vv-mode" style="margin-top:10px">OCR: đã chạy sẵn khi tải ảnh · Mô hình 0,92 s · Tổng 0,93 s</div>
    </div>
  </div>
  <div class="panel dark" id="dark">
    <h2>Dark theme</h2>
    <div class="dark">
      <div class="vv-card">
        <div class="vv-mode">Câu trả lời</div>
        <div class="vv-ans">mèo</div>
        <span class="vv-badge" style="color:#0f5132;background:#d1e7dd">Độ tin cậy: Cao</span>
        <span class="vv-mode">Câu hỏi mở</span>
        <div class="vv-mode" style="margin-top:10px">OCR: dùng lại từ cache · Mô hình 0,95 s · Tổng 0,96 s</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
